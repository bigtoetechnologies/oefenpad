<!doctype html>
<html lang="nl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#2B50C8">
<title>Verhaalmachine — Oefenpad</title>
<link rel="icon" type="image/png" href="../../assets/logo/logo_32px.png">
<script>
/* Donkere modus — zet de klasse voordat er iets getekend wordt, en onthoudt
   de keuze. Gelijk aan het blok in de oefeningen; sleutel oefenpad-theme. */
(function () {
  var KEY = 'oefenpad-theme';
  function apply(saved) {
    /* Altijd licht, tenzij de bezoeker zelf donker koos. De systeemvoorkeur
       telt niet mee: wit papier met penseelvlakken is het ontwerp. */
    document.documentElement.classList.toggle('dark', saved === 'dark');
  }
  var saved = null;
  try { saved = localStorage.getItem(KEY); } catch (e) { /* privemodus */ }
  apply(saved);
  window.toggleSiteTheme = function () {
    var dark = !document.documentElement.classList.contains('dark');
    document.documentElement.classList.toggle('dark', dark);
    try { localStorage.setItem(KEY, dark ? 'dark' : 'light'); } catch (e) {}
    document.dispatchEvent(new CustomEvent('themechange', { detail: { dark: dark } }));
  };
  document.addEventListener('click', function (e) {
    var t = e.target;
    var btn = t && t.closest ? t.closest('#theme-toggle') : null;
    if (btn) toggleSiteTheme();
  });
  window.addEventListener('storage', function (e) {
    if (e.key === KEY && e.newValue) {
      apply(e.newValue);
      document.dispatchEvent(new CustomEvent('themechange',
        { detail: { dark: document.documentElement.classList.contains('dark') } }));
    }
  });
})();
</script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../../assets/site/oefenpad.css">
<link rel="stylesheet" href="style.css">
</head>
<body>

<div class="vel">

  <nav class="balk">
    <a class="merk" href="../../index.html"><img src="../../assets/logo/logo_128px.png" alt=""><span>Oefenpad</span></a>
    <a class="link" href="../../index.html">Oefeningen</a>
    <a class="link" href="#">Over</a>
    <div class="rechts"><a class="knop klein leeg" href="../../index.html">← Alle oefeningen</a></div>
  </nav>

  <main class="machine">

    <header class="machine-top">
      <h1>Verhaalmachine</h1>
      <p class="tagline">Trek aan de hendel. Vertel het verhaal.</p>
    </header>

    <div class="controls">
      <label class="control">
        <span>Rollen</span>
        <input type="range" id="reel-count" min="2" max="6" value="3" step="1">
        <output id="reel-count-out">3</output>
      </label>

      <label class="control control-check">
        <input type="checkbox" id="lang-nl" checked>
        <span>Nederlands</span>
      </label>
    </div>

    <div class="cabinet">
      <div class="window" id="window"></div>

      <button class="lever" id="lever" aria-label="Trek aan de hendel">
        <span class="lever-stick"></span>
        <span class="lever-knob"></span>
      </button>
    </div>

    <div class="cards" id="cards"></div>

    <p class="held-hint">Tik op een rol om hem vast te zetten en trek opnieuw. Draai een kaart om voor het woord.</p>

    <p class="sr-only" id="announce" aria-live="polite"></p>

  </main>

  <footer class="voet">
    <div class="links">Woorden uit <em>Quick Wins in Dutch</em></div>
    <div class="rechts">
      <a href="../../voorwaarden.html">Voorwaarden</a>
      <a href="../../privacy.html">Privacy</a>
    </div>
  </footer>
</div>

<script src="reels.js"></script>
<script src="script.js"></script>
<script defer src="../../assets/site/oefenpad.js"></script>
</body>
</html>
